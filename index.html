<title>Consulta de Unidades - CLUES IMSS</title>
<style>
:root {
  --primary:#1769aa;
  --primary-dark:#0d4775;
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#64748b;
  --border:#dbe3ec;
}
* { box-sizing:border-box; }
body {
  margin:0; font-family:Segoe UI,Arial,sans-serif; background:var(--bg);
  color:var(--text);
}
.container { max-width:1250px; margin:0 auto; padding:28px 18px 50px; }
.header {
  background:linear-gradient(135deg,var(--primary-dark),var(--primary));
  color:white; padding:28px; border-radius:16px; margin-bottom:20px;
  box-shadow:0 8px 24px rgba(15,58,94,.15);
}
.header h1 { margin:0 0 7px; font-size:27px; }
.header p { margin:0; opacity:.9; }
.search-card {
  background:white; border:1px solid var(--border); border-radius:16px;
  padding:22px; box-shadow:0 4px 16px rgba(30,50,70,.06);
}
label { display:block; font-weight:700; margin-bottom:8px; }
.search-row { display:flex; gap:10px; }
input {
  flex:1; padding:14px 16px; border:1px solid #b9c6d5; border-radius:10px;
  font-size:17px; outline:none; text-transform:uppercase;
}
input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(23,105,170,.12); }
button {
  border:0; border-radius:10px; padding:0 22px; background:var(--primary);
  color:#fff; font-weight:700; cursor:pointer; font-size:15px;
}
button:hover { background:var(--primary-dark); }
.hint { color:var(--muted); font-size:13px; margin-top:9px; }
#status { margin:18px 0 10px; color:var(--muted); }
.result {
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  margin-top:18px; overflow:hidden; box-shadow:0 4px 16px rgba(30,50,70,.05);
}
.result-head {
  padding:18px 22px; background:#eef6fd; border-bottom:1px solid var(--border);
}
.result-head h2 { margin:0 0 5px; font-size:20px; color:var(--primary-dark); }
.result-head span { color:var(--muted); font-size:13px; }
.section { padding:20px 22px; border-bottom:1px solid #e7edf3; }
.section:last-child { border-bottom:0; }
.section h3 { margin:0 0 14px; color:var(--primary-dark); font-size:17px; }
.grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px;
}
.field {
  border:1px solid #e2e8f0; border-radius:10px; padding:11px 13px; background:#fafcfe;
}
.field .name { display:block; color:var(--muted); font-size:12px; margin-bottom:5px; }
.field .value { display:block; font-weight:600; word-break:break-word; white-space:pre-wrap; }
.empty {
  text-align:center; padding:35px 20px; color:var(--muted);
  background:white; border:1px dashed var(--border); border-radius:14px;
}
.count { font-weight:700; color:var(--primary-dark); }
@media(max-width:650px) {
  .search-row { flex-direction:column; }
  button { height:48px; }
  .header h1 { font-size:22px; }
}
</style>
</head>

</div>

const searchInput = document.getElementById('search');
const results = document.getElementById('results');
const status = document.getElementById('status');

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, function(ch) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch];
  });
}

function buscar() {
  const q = searchInput.value.trim().toUpperCase();
  results.innerHTML = '';

  if (!q) {
    status.textContent = 'Escribe un CLUES IMSS para realizar la búsqueda.';
    return;
  }

  const encontrados = datos.filter(r =>
    String(r["CLUES IMSS"] || '').toUpperCase().includes(q)
  );

  status.innerHTML = encontrados.length
    ? `<span class="count">${encontrados.length}</span> registro(s) encontrado(s).`
    : 'No se encontraron registros para ese CLUES IMSS.';

  encontrados.forEach((registro, index) => {
    const card = document.createElement('div');
    card.className = 'result';

    let sections = '';
    Object.entries(grupos).forEach(([grupo, campos]) => {
      let fields = '';
      campos.forEach(campo => {
        const valor = registro[campo] ?? '';
        if (valor !== '') {
          fields += `
            <div class="field">
              <span class="name">${escapeHtml(campo)}</span>
              <span class="value">${escapeHtml(valor)}</span>
            </div>`;
        }
      });

      if (fields) {
        sections += `
          <div class="section">
            <h3>${escapeHtml(grupo)}</h3>
            <div class="grid">${fields}</div>
          </div>`;
      }
    });

    card.innerHTML = `
      <div class="result-head">
        <h2>${escapeHtml(registro["Nombre de la Unidad"] || "Unidad")}</h2>
        <span>Resultado ${index + 1} · CLUES IMSS: <strong>${escapeHtml(registro["CLUES IMSS"])}</strong></span>
      </div>
      ${sections}
    `;
    results.appendChild(card);
  });
}

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') buscar();
});
