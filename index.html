<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo Delegacional Chiapas</title>
<style>
  :root{
    --brand:#006455;
    --brand-dark:#004a40;
    --brand-tint:#e4f1ee;
    --brand-line:#b9d7d1;
    --ink:#142925;
    --muted:#5b706b;
    --bg:#f3f7f6;
    --card:#ffffff;
    --warn:#8a5a00;
    --warn-bg:#fff4d6;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}

  header{background:var(--brand);color:#fff;padding:28px 20px 30px}
  .wrap{max-width:1080px;margin:0 auto}
  header .wrap{position:relative}
  .logo{position:absolute;top:-8px;right:0;width:84px;height:84px;border-radius:14px;background:#fff;border:2px solid rgba(255,255,255,.55);box-shadow:0 2px 8px rgba(0,0,0,.18);object-fit:cover}
  header h1{padding-right:100px}
  header h1{margin:0 0 20px;font-size:1.65rem;font-weight:700;letter-spacing:-.01em}
  header p{margin:0 0 20px;opacity:.88}
  .search{display:grid;grid-template-columns:1fr 1.6fr;gap:14px}
  .field label{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px}
  .field .box{position:relative}
  .field input{width:100%;padding:12px 40px 12px 14px;border:2px solid transparent;border-radius:8px;font:inherit;color:var(--ink);background:#fff}
  .field input::placeholder{color:#8aa09b}
  .field input:focus{outline:none;border-color:#9be0d0;box-shadow:0 0 0 3px rgba(155,224,208,.45)}
  .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:1.2rem;line-height:1;cursor:pointer;display:none}
  .clear:hover{background:var(--brand-tint);color:var(--brand)}
  .clear:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  .hint{margin:12px 0 0;font-size:.85rem;opacity:.85}

  main{max-width:1080px;margin:0 auto;padding:20px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .bar[hidden]{display:none}
  .count{font-weight:600}
  .count span{color:var(--muted);font-weight:400}
  .tools button{font:inherit;font-size:.85rem;padding:6px 12px;border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:6px;cursor:pointer}
  .tools button+button{margin-left:6px}
  .tools button:hover{background:var(--brand-tint)}
  button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  .empty{background:var(--card);border:1px dashed var(--brand-line);border-radius:10px;padding:34px 22px;text-align:center;color:var(--muted)}
  .empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}

  details.unit{background:var(--card);border:1px solid var(--brand-line);border-left:5px solid var(--brand);border-radius:10px;margin-bottom:12px;overflow:hidden}
  details.unit>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
  details.unit>summary::-webkit-details-marker{display:none}
  .sum-main h2{margin:0;font-size:1.12rem;line-height:1.3}
  .sum-main .sub{color:var(--muted);font-size:.88rem;margin-top:2px}
  .sum-side{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
  .chip{display:inline-block;background:var(--brand);color:#fff;border-radius:999px;padding:3px 11px;font-size:.82rem;font-weight:600;white-space:nowrap}
  .chip.soft{background:var(--brand-tint);color:var(--brand-dark)}
  .chip.dup{background:var(--warn-bg);color:var(--warn)}
  .chev{width:10px;height:10px;border-right:2px solid var(--brand);border-bottom:2px solid var(--brand);transform:rotate(45deg);margin:8px 4px 0 6px;flex:none;transition:transform .15s}
  details[open]>summary .chev{transform:rotate(-135deg);margin-top:12px}
  .body{border-top:1px solid var(--brand-line);padding:6px 16px 16px}
  .group h3{margin:16px 0 8px;font-size:.92rem;color:var(--brand);padding-bottom:4px;border-bottom:1px solid var(--brand-tint)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 18px}
  .item dt{font-size:.76rem;color:var(--muted);margin:0}
  .item dd{margin:1px 0 0;font-weight:500;word-break:break-word}
  .item dd.na{color:#93a5a1;font-weight:400;font-style:italic}
  .item a{color:var(--brand);font-weight:600}
  .copy{margin-top:16px;font:inherit;font-size:.85rem;padding:7px 14px;border:0;border-radius:6px;background:var(--brand);color:#fff;cursor:pointer}
  .copy:hover{background:var(--brand-dark)}
  mark{background:#ffe27a;color:var(--ink);border-radius:2px;padding:0 1px}
  .more{color:var(--muted);text-align:center;padding:8px}

  @media (max-width:700px){
    .logo{width:56px;height:56px;border-radius:10px;top:-4px}
    header h1{padding-right:70px}
    .search{grid-template-columns:1fr}
    details.unit>summary{flex-direction:column}
    .sum-side{justify-content:flex-start}
  }
  @media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
</head>

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function highlight(text, terms) {
  const raw = String(text), n = norm(raw);
  if (n.length !== raw.length) return esc(raw);
  const marks = new Array(raw.length).fill(false);
  terms.filter(Boolean).forEach(t => {
    let i = n.indexOf(t);
    while (i !== -1) { for (let k = i; k < i + t.length; k++) marks[k] = true; i = n.indexOf(t, i + t.length); }
  });
  let out = '', open = false;
  for (let k = 0; k < raw.length; k++) {
    if (marks[k] && !open) { out += '<mark>'; open = true; }
    if (!marks[k] && open) { out += '</mark>'; open = false; }
    out += esc(raw[k]);
  }
  return out + (open ? '</mark>' : '');
}

function cleanLabel(h) { return String(h).replace(/\s+/g, ' ').trim(); }

function display(i, v) {
  if (v == null || v === '' || v === '#N/A') return { html: 'Sin dato', na: true, text: 'Sin dato' };

    const t = (Math.round(v * 10000) / 100).toLocaleString('es-MX') + '%';

  if ((i === IDX_LAT || i === IDX_LON) && !isNaN(parseFloat(v))) {
    return { html: esc(v), text: String(v) };
  }
  return { html: esc(v), text: String(v) };
}

      const d = display(i, row[i]);
      let val = d.html;
      if (i === IDX_CLUES) val = highlight(row[i], terms.c);
      if (i === IDX_NAME) val = highlight(row[i], terms.n);
      if (i === IDX_LON && !d.na && row[IDX_LAT] && !isNaN(parseFloat(row[IDX_LAT]))) {
        val += ' &nbsp;<a href="https://www.google.com/maps?q=' + encodeURIComponent(row[IDX_LAT] + ',' + row[IDX_LON]) + '" target="_blank" rel="noopener">Ver en mapa</a>';
      }
      items += '<div class="item"><dt>' + esc(cleanLabel(H[i])) + '</dt><dd' + (d.na ? ' class="na"' : '') + '>' + val + '</dd></div>';
    }
    body += '<section class="group"><h3>' + esc(title) + '</h3><dl class="grid" style="margin:0">' + items + '</dl></section>';
  }
  return '<details class="unit"' + (expanded ? ' open' : '') + '>' +
    '<summary><div class="sum-main"><h2>' + highlight(row[IDX_NAME], terms.n) + '</h2>' +
    '<div class="sub">' + esc(subTxt) + '</div></div>' +
    '<div class="sum-side">' +
      (dup ? '<span class="chip dup">CLUES repetida (' + cluesCount[norm(clues)] + ')</span>' : '') +
      '<span class="chip soft">' + esc(row[IDX_TIPO] || '') + '</span>' +
      '<span class="chip">' + highlight(clues, terms.c) + '</span>' +
      '<span class="chev" aria-hidden="true"></span></div></summary>' +
    '<div class="body">' + body +
    '<button type="button" class="copy" data-row="' + R.indexOf(row) + '">Copiar datos</button></div></details>';
}

function render() {
  const qc = norm($('qClues').value), qn = norm($('qName').value);
  document.querySelectorAll('.clear').forEach(b => { b.style.display = $(b.dataset.for).value ? 'block' : 'none'; });
  const res = $('results'), bar = $('bar');
  if (!qc && !qn) {
    bar.hidden = true;
    res.innerHTML = '<div class="empty"><strong>Busca una unidad</strong>Escribe la CLUES IMSS o el nombre de la unidad para ver todos sus datos.</div>';
    return;
  }
  const tokens = qn.split(/\s+/).filter(Boolean);
  const hits = [];
  for (let i = 0; i < R.length; i++) {
    if (qc && !NC[i].includes(qc)) continue;
    if (tokens.length && !tokens.every(t => NN[i].includes(t))) continue;
    let score = 2;
    if ((qc && NC[i] === qc) || (qn && NN[i] === qn)) score = 0;
    else if ((qc && NC[i].startsWith(qc)) || (qn && NN[i].startsWith(qn))) score = 1;
    hits.push([score, i]);
  }
  hits.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  bar.hidden = false;
  if (!hits.length) {
    $('count').innerHTML = '0 coincidencias';
    $('openAll').parentElement.style.visibility = 'hidden';
    res.innerHTML = '<div class="empty"><strong>Sin resultados</strong>Revisa la ortografía o prueba con una parte de la CLUES o del nombre.</div>';
    return;
  }
  $('openAll').parentElement.style.visibility = 'visible';
  const shown = hits.slice(0, MAX_SHOWN);
  const expanded = hits.length <= 3;
  $('count').innerHTML = hits.length.toLocaleString('es-MX') + (hits.length === 1 ? ' coincidencia' : ' coincidencias') +
    (hits.length > MAX_SHOWN ? ' <span>(se muestran las primeras ' + MAX_SHOWN + ')</span>' : '');
  res.innerHTML = shown.map(([, i]) => renderCard(R[i], qc, qn, expanded)).join('') +
    (hits.length > MAX_SHOWN ? '<div class="more">Escribe más caracteres para acotar la búsqueda.</div>' : '');
}

let timer;
['qClues', 'qName'].forEach(id => $(id).addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 120); }));
$('qClues').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; render(); } });
$('qName').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; render(); } });
document.querySelectorAll('.clear').forEach(b => b.addEventListener('click', () => { const i = $(b.dataset.for); i.value = ''; render(); i.focus(); }));
$('openAll').addEventListener('click', () => document.querySelectorAll('details.unit').forEach(d => d.open = true));
$('closeAll').addEventListener('click', () => document.querySelectorAll('details.unit').forEach(d => d.open = false));

$('results').addEventListener('click', e => {
  const btn = e.target.closest('.copy');
  if (!btn) return;
  const row = R[+btn.dataset.row];
  const text = row.map((v, i) => cleanLabel(H[i]) + ': ' + display(i, v).text).join('\n');
  const done = () => { const t = btn.textContent; btn.textContent = 'Copiado'; setTimeout(() => btn.textContent = t, 1500); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done);
  else { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (_) {} ta.remove(); }
});

render();
</script>
</body>
</html>
